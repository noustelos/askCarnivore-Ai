<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Carnivore Ai — No app. No sign-up. Just Ask.</title>
<meta name="description" content="Ask a question about the carnivore diet and get sent to the videos that cover it. No app, no sign-up.">
<meta name="theme-color" content="#4a1024">
<meta property="og:title" content="Ask Carnivore Ai">
<meta property="og:description" content="No app. No sign-up. Just Ask.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://askcarnivore.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%A9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="chat.css">
<style>
  /* ------------------------------------------------------------------
     Morphing ring: circle → triangle → square → circle, breathing
     throughout. The breath descends from "Heartbeating Ring Preloader"
     by Jon Kantner (https://codepen.io/jkantner/pen/RNKyWKd) — SCSS
     compiled to plain CSS, retimed to a calm exhale.

     The shape cycle itself runs on SMIL in the markup below (the `d`
     property is not animatable via CSS in Firefox), so its timings live
     there, not here: 2.7s hold + 0.9s morph per shape = 10.8s a lap.
     ------------------------------------------------------------------ */

  *, *::before, *::after {
    border: 0;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    /* Deepened from the original hsl(… 90% 50%) so white text clears WCAG AA
       on every phase of the cycle (8.5:1 / 5.6:1 / 9.8:1). */
    --c1: hsl(343 72% 34%);   /* wine    */
    --c2: hsl(33 85% 32%);    /* sear    */
    --c3: hsl(223 65% 34%);   /* indigo  */

    --fg:       hsl(20 20% 97%);
    --fg-soft:  hsl(20 18% 97% / .82);

    /* 2.7s, not 2.6s, so 10.8 / 2.7 = 4 — exactly four breaths per shape
       lap, keeping the two rhythms from drifting against each other. */
    --pulse-dur: 2.7s;        /* one breath  (was 1s — a fast heartbeat) */
    --shift-dur: 27s;         /* full colour cycle (was 3s) */

    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
            Helvetica, Arial, sans-serif;

    font-size: clamp(1rem, 0.95rem + 0.25vw, 1.2rem);
  }

  body {
    min-height: 100svh;
    display: grid;
    /* Two rows so the credit sits at the foot without overlapping the mark
       on a short landscape viewport — main stays centred in what is left. */
    grid-template-rows: 1fr auto;
    place-items: center;
    padding: 2rem 1.5rem;
    background-color: var(--c1);
    animation: shift-color var(--shift-dur) linear infinite;
    color: var(--fg);
    font-family: var(--font);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* Was `overflow: hidden` when this page held four lines of text. The
       thread scrolls inside itself, but a long answer on a short phone still
       needs the page to give. Horizontal stays locked. */
    overflow-x: hidden;
  }

  /* Vignette — adds depth and keeps the edges from flattening out. */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 75% 65% at 50% 45%,
                                transparent 35%, hsl(0 0% 0% / .38) 100%);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 34rem;
    text-align: center;
    animation: rise 1s cubic-bezier(.16, 1, .3, 1) both;
  }

  /* ---- the mark ---- */

  .pl {
    display: block;
    width: clamp(5.5rem, 22vw, 7.5rem);
    height: auto;
    margin: 0 auto 2.5rem;
    filter: drop-shadow(0 0 1.75rem hsl(0 0% 0% / .3));
    transition: width .6s cubic-bezier(.16, 1, .3, 1),
                margin .6s cubic-bezier(.16, 1, .3, 1);
  }

  /* Once a conversation starts, the masthead steps back and gives the room to
     the answers. The mark stays — it is the one thing that carries over into
     the working state. */
  .is-active .pl { width: clamp(3rem, 12vw, 4rem); margin-bottom: 1.1rem; }
  .is-active h1  { font-size: clamp(1.35rem, 5vw, 1.7rem); }
  .is-active .tagline { display: none; }

  /* ---- type ---- */

  h1 {
    font-size: clamp(2rem, 8vw, 3.1rem);
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: 1.05;
    text-wrap: balance;
  }

  .tagline {
    margin-top: .9rem;
    font-size: clamp(1rem, 3.6vw, 1.2rem);
    font-weight: 500;
    letter-spacing: .01em;
    color: var(--fg-soft);
    text-wrap: balance;
  }

  /* ---- the ask box ---- */

  /* The chat surface itself is styled in chat.css, shared with /embed. Only
     its placing on this page belongs here. */
  .chat { margin-top: 2rem; }

  /* ---- footer credit ---- */

  footer {
    position: relative;
    z-index: 1;
    margin-top: 2.5rem;
    animation: rise 1s cubic-bezier(.16, 1, .3, 1) .25s both;
  }

  .by {
    display: inline-block;
    padding: .4rem .3rem;
    color: var(--fg-soft);
    font-size: clamp(.6rem, 2.3vw, .7rem);
    font-weight: 600;
    letter-spacing: .07em;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    opacity: .68;
    transition: opacity .25s ease;
  }

  .by:hover,
  .by:focus-visible { opacity: 1; }

  .by:focus-visible {
    border-radius: .35rem;
    outline: 2px solid hsl(0 0% 100% / .75);
    outline-offset: 2px;
  }

  .by__name { font-weight: 700; color: var(--fg); }

  /* The studio's own mark, kept to its proportions: 0.74em, weight 600,
     letter-spacing .03em, lifted .32em off the baseline, and set apart by
     the same .18em gap. Only the colour differs — the site's #6f665b would
     disappear against these backgrounds, so the mark keeps its *role*
     (a quieter companion to the wordmark) rather than its exact value. */
  .by__mark {
    display: inline-block;
    margin-left: .18em;
    color: hsl(20 18% 97% / .58);
    font-size: .74em;
    font-weight: 600;
    letter-spacing: .03em;
    transform: translateY(-.32em);
  }

  /* ---- animations ---- */

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  /* Percentages below are the compiled form of the original SCSS
     interpolations (31/180, 60/180, 91/180, 120/180, 151/180). */
  @keyframes shift-color {
    0%, 17.222%, 100%   { background-color: var(--c1); }
    33.333%, 50.556%    { background-color: var(--c2); }
    66.667%, 83.889%    { background-color: var(--c3); }
  }

  /* Covers the CSS animations only — SMIL ignores `animation: none`, so the
     shape cycle is frozen from the script at the foot of the document. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    body { background-color: var(--c1); }
  }
</style>
</head>
<body>
  <main>
    <!-- ================================================================
         One ring, three forms: circle → triangle → square → circle.

         All three are the SAME path — 4 cubic Bézier segments, same count,
         same order — which is what lets them interpolate cleanly:
           · circle   = 4 arcs (k = 0.5523·r), turned 45° so the anchors
                        land on the square's corners
           · square   = 4 straight runs (controls at 1/3 and 2/3)
           · triangle = 3 sides + 1 degenerate segment at the apex, i.e.
                        the two top corners collapse into one point

         Coordinates are relative to the centre; translate(60,60) on the
         <g> places them. Every rotate/scale therefore pivots around (0,0)
         = the centre, with no reliance on transform-box/transform-origin.
         ================================================================ -->
    <svg class="pl" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <defs>
        <path id="acShape" d="M 31.82 -31.82
                              C 49.39 -14.25, 49.39 14.25, 31.82 31.82
                              C 14.25 49.39, -14.25 49.39, -31.82 31.82
                              C -49.39 14.25, -49.39 -14.25, -31.82 -31.82
                              C -14.25 -49.39, 14.25 -49.39, 31.82 -31.82 Z">
          <animate
            attributeName="d"
            dur="10.8s"
            repeatCount="indefinite"
            calcMode="spline"
            keyTimes="0;0.25;0.3333;0.5833;0.6667;0.9167;1"
            keySplines="0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1"
            values="
              M 31.82 -31.82 C 49.39 -14.25, 49.39 14.25, 31.82 31.82 C 14.25 49.39, -14.25 49.39, -31.82 31.82 C -49.39 14.25, -49.39 -14.25, -31.82 -31.82 C -14.25 -49.39, 14.25 -49.39, 31.82 -31.82 Z;
              M 31.82 -31.82 C 49.39 -14.25, 49.39 14.25, 31.82 31.82 C 14.25 49.39, -14.25 49.39, -31.82 31.82 C -49.39 14.25, -49.39 -14.25, -31.82 -31.82 C -14.25 -49.39, 14.25 -49.39, 31.82 -31.82 Z;
              M 0 -52 C 15.01 -26, 30.02 0, 45.03 26 C 15.01 26, -15.01 26, -45.03 26 C -30.02 0, -15.01 -26, 0 -52 C 0 -52, 0 -52, 0 -52 Z;
              M 0 -52 C 15.01 -26, 30.02 0, 45.03 26 C 15.01 26, -15.01 26, -45.03 26 C -30.02 0, -15.01 -26, 0 -52 C 0 -52, 0 -52, 0 -52 Z;
              M 39 -39 C 39 -13, 39 13, 39 39 C 13 39, -13 39, -39 39 C -39 13, -39 -13, -39 -39 C -13 -39, 13 -39, 39 -39 Z;
              M 39 -39 C 39 -13, 39 13, 39 39 C 13 39, -13 39, -39 39 C -39 13, -39 -13, -39 -39 C -13 -39, 13 -39, 39 -39 Z;
              M 31.82 -31.82 C 49.39 -14.25, 49.39 14.25, 31.82 31.82 C 14.25 49.39, -14.25 49.39, -31.82 31.82 C -49.39 14.25, -49.39 -14.25, -31.82 -31.82 C -14.25 -49.39, 14.25 -49.39, 31.82 -31.82 Z" />
        </path>
      </defs>

      <g transform="translate(60,60)" fill="none" stroke="currentcolor"
         stroke-width="10" stroke-linejoin="round" stroke-linecap="round">

        <!-- The mark turns as it changes form. Each stop lands on an angle of
             the shape's own symmetry so triangle and square sit level:
             0° → 120° (3-fold) → 270° (4-fold) → 390°. At 390° we are back
             to a circle, so the loop's jump to 0° is invisible. -->
        <g>
          <animateTransform
            attributeName="transform" type="rotate"
            dur="10.8s" repeatCount="indefinite" calcMode="spline"
            keyTimes="0;0.25;0.3333;0.5833;0.6667;0.9167;1"
            keySplines="0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1"
            values="0;0;120;120;270;270;390" />

          <!-- Echo — a faint ping outward. Same shape, same beat as the
               breath, so it reads as one gesture rather than two. -->
          <use class="pl__echo" href="#acShape" stroke-width="6" opacity="0">
            <animateTransform attributeName="transform" type="scale"
              dur="2.7s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;1" keySplines=".22 .61 .36 1" values="1;1.3" />
            <animate attributeName="opacity"
              dur="2.7s" repeatCount="indefinite"
              keyTimes="0;0.18;1" values="0;.3;0" />
          </use>

          <!-- The breath. Original amplitude and easing, moved off the
               <circle>'s r (which does not exist on a <path>) and onto
               scale + stroke-width. Four breaths per shape lap. -->
          <use class="pl__ring" href="#acShape">
            <animateTransform attributeName="transform" type="scale"
              dur="2.7s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;0.48;0.74;1"
              keySplines=".37 0 .63 1;.37 0 .63 1;.37 0 .63 1"
              values="1;1;1.05;1" />
            <animate attributeName="stroke-width"
              dur="2.7s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;0.48;0.74;1"
              keySplines=".37 0 .63 1;.37 0 .63 1;.37 0 .63 1"
              values="10;10;13;10" />
            <animate attributeName="opacity"
              dur="2.7s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;0.48;0.74;1"
              keySplines=".37 0 .63 1;.37 0 .63 1;.37 0 .63 1"
              values="1;1;.72;1" />
          </use>
        </g>
      </g>
    </svg>

    <h1>Ask Carnivore Ai</h1>

    <p class="tagline">No app. No sign-up. Just Ask.</p>

    <!-- The same chat surface the portal frames at /embed — one markup
         contract, one stylesheet, one client (chat.css / chat.js). -->
    <section class="chat" id="chat">
      <div class="chat__thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>

      <form class="chat__form" id="ask-form">
        <label class="visually-hidden" for="q">Ask about the carnivore diet</label>
        <input class="chat__input" id="q" name="q" type="text" autocomplete="off"
               enterkeyhint="send" maxlength="500" placeholder="Ask a question…" required>
        <button class="chat__send" id="send" type="submit">Ask</button>
      </form>

      <!-- The framing rule is the accuracy disclaimer; the medical line sits on
           top of it. Both are visible before the first question is asked. -->
      <p class="chat__note">
        This points you at what people in this community say — positions, not
        settled fact, and not medical advice. For anything about your own health,
        ask your doctor.
      </p>
    </section>
  </main>

  <footer>
    <!-- The "/>" is the studio's mark, not punctuation — decorative here,
         so it stays out of the accessible name ("A NOUSTELOS_STUDIO PROJECT"). -->
    <a class="by" href="https://noustelos.gr/" target="_blank" rel="noopener">A <span class="by__name">NOUSTELOS_STUDIO</span> PROJECT<span class="by__mark" aria-hidden="true">/&gt;</span></a>
  </footer>

<script>
  /* SMIL does not honour the reduced-motion media query the way CSS does,
     so freeze the shape cycle explicitly — at t=0, i.e. on the circle. */
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelector('.pl').pauseAnimations();
  }
</script>
<script src="chat.js"></script>
</body>
</html>
